# Jogo Platform — Full Stack Docker Compose
# Runs: jogo-api (.NET), jogo-ai (Python/FastAPI), sqlserver, seq
#
# Usage:
#   docker compose up --build        # build & start everything
#   docker compose up --build -d     # detached (background)
#   docker compose down              # stop & remove containers
#   docker compose logs -f jogo-api  # tail backend logs

services:

  # ─────────────────────────────────────────────────
  #  C# / ASP.NET Core Backend
  # ─────────────────────────────────────────────────
  jogo-api:
    build:
      context: ./BE/Jogo
      dockerfile: src/Jogo.Api/Dockerfile
      target: final
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >
        Server=sqlserver,1433;Database=JogoDb;User=sa;
        Password=YourStrong@Password1;
        TrustServerCertificate=True;MultipleActiveResultSets=True
      # Override AiService:BaseUrl to reach the AI container on the internal network
      AiService__BaseUrl: http://jogo-ai:8000
      ApiBaseUrl: http://jogo-api:8080
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341
    depends_on:
      sqlserver:
        condition: service_healthy
      jogo-ai:
        condition: service_healthy
    restart: on-failure
    networks:
      - jogo-net

  # ─────────────────────────────────────────────────
  #  Python / FastAPI AI Service
  # ─────────────────────────────────────────────────
  jogo-ai:
    build:
      context: ./football_performance_analysis
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: on-failure
    networks:
      - jogo-net

  # ─────────────────────────────────────────────────
  #  SQL Server 2022
  # ─────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: YourStrong@Password1
      MSSQL_PID: Developer
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Password1", "-Q", "SELECT 1", "-C"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: always
    networks:
      - jogo-net

  # ─────────────────────────────────────────────────
  #  Seq — Structured Logging UI
  # ─────────────────────────────────────────────────
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"   # ingestion
      - "8081:80"     # web UI -> http://localhost:8081
    volumes:
      - seq-data:/data
    restart: unless-stopped
    networks:
      - jogo-net

volumes:
  sqlserver-data:
  seq-data:

networks:
  jogo-net:
    driver: bridge
