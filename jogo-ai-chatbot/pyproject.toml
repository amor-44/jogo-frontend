[project]
name = "jogo-ai-chatbot"
version = "0.1.0"
description = "Jogo player-assistant chatbot service (Gemini-backed)."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "python-dotenv==1.0.1",
    "google-genai==0.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
